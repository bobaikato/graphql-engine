version: 1
project:
  name: hasura-v3
  description: >
    Narrow Hasura v3 pressure slice covering the workspace Rust/Cargo verification lane and the
    packaged docker-compose runtime that serves static metadata.json; the broader monorepo and the
    DDN-authored local metadata build lifecycle remain out of scope for this contract
  type: application
metadata:
  ota:
    minimum_version: "1.6.21"
execution:
  default_context: host
  contexts:
    host:
      backend: native
toolchains:
  rust:
    version: "1.94.1"
    profile: default
    fulfillment:
      mode: run
tools:
  docker:
    version: "*"
    required: false
checks:
  - name: static-metadata-present
    kind: file
    severity: error
    path: static/metadata.json
    expect: file
  - name: static-auth-config-present
    kind: file
    severity: error
    path: static/auth/auth_config_v3.json
    expect: file
surfaces:
  engine-http:
    kind: http
    port: 3000
    path: /
    readiness:
      kind: http
      method: GET
      path: /health
      success:
        status:
          - 200
      interval: 5s
      timeout: 5s
      retries: 72
      start_period: 120s
services:
  engine:
    manager:
      kind: compose
      name: hasura-v3
      file: docker-compose.yaml
      service: engine
    endpoints:
      host:
        address: 127.0.0.1
        port: 3000
    readiness:
      from: host
      kind: http
      method: GET
      path: /health
      success:
        status:
          - 200
      interval: 5s
      timeout: 5s
      retries: 72
      start_period: 120s
tasks:
  setup:
    context: host
    description: Hydrate workspace Cargo dependencies through the declared Rust toolchain lane
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: cargo
        cwd: .
    requirements:
      toolchains:
        - rust
    effects:
      writes:
        - target
      network: true
      network_kind: dependency_hydration
  lint:
    context: host
    description: Run the canonical workspace clippy verification lane
    command:
      exe: cargo
      args:
        - clippy
        - --all-targets
        - --no-deps
    depends_on:
      - setup
    requirements:
      toolchains:
        - rust
  build:
    context: host
    description: Compile the full v3 workspace through the canonical release build lane
    command:
      exe: cargo
      args:
        - build
        - --release
        - --all-targets
    depends_on:
      - setup
    requirements:
      toolchains:
        - rust
  verify:
    description: Run the narrow source verification slice modeled by this contract
    aggregate:
      tasks:
        - lint
        - build
  compose:up:
    context: host
    description: Start the narrow packaged engine runtime with static metadata.json
    notes: |
      This intentionally proves the smallest truthful packaged engine slice from `v3/docker-compose.yaml`
      that can satisfy the declared `/health` runtime proof.
      It does not pretend to own the broader full-stack Postgres/connector/DDN local build path yet;
      those remain a separate Ota platform pressure point.
    category: dev
    adapter_inputs:
      compose:
        files:
          - docker-compose.yaml
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
        - --no-deps
        - engine
    requirements:
      tools:
        docker: "*"
      checks:
        - static-metadata-present
        - static-auth-config-present
    effects:
      external_state:
        - docker
    runtime:
      kind: service
      surfaces:
        engine-http:
          project:
            host:
              primary: true
  compose:down:
    context: host
    description: Stop the narrow packaged engine runtime
    category: setup
    adapter_inputs:
      compose:
        files:
          - docker-compose.yaml
    compose:
      kind: down
      engine: docker
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
workflows:
  default: verify
  verify:
    intent: ci_verification
    description: Canonical Rust/Cargo verification path for the Hasura v3 workspace slice
    setup:
      task: setup
    run:
      task: verify
  docker:
    intent: packaged_runtime
    description: Narrow packaged engine runtime with static metadata.json and declared compose dependencies
    run:
      task: compose:up
    readiness:
      surfaces:
        - engine-http
    exposes:
      - surface: engine-http
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
    - setup
    - lint
    - build
    - verify
  verify_after_changes:
    - lint
    - build
  writable_paths:
    - target
    - crates
    - static
    - benchmarks
    - rfcs
  protected_paths:
    - docker-compose.yaml
    - ci.docker-compose.yaml
    - ota.yaml
  notes: |
    Keep this contract scoped to `v3/`.
    Do not widen this into monorepo truth unless Hasura's root runtime and setup paths are modeled
    intentionally.
    The static metadata packaged engine path is modeled here because it is explicit repo truth today.
    The DDN local build path is not yet first-class Ota ownership; call that out as a platform gap
    instead of hiding it in shell glue.
  bootstrap:
    ota:
      note: Install ota when missing so contributors and agents can run the readiness workflows declared in this contract.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_BRANCH=1.6.22-implementation sh -s -- --from-git
      powershell: $env:OTA_GIT_BRANCH='1.6.22-implementation'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
